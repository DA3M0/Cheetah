[package]
name = "cheetah"
version = "0.9.0"
edition = "2024"
description = "Local model chat and OpenAI-compatible inference powered by Candle and Safetensors."
license = "Apache-2.0"

[dependencies]
candle-core="0.11"
candle-nn="0.11"
candle-transformers="0.11"
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }

safetensors = "0.8"
tokenizers = "0.23"
memmap2 ="0.9"
libc = "0.2"
# Candle 0.11 uses rand 0.9 APIs for half-precision sampling.
half = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

bytes = "1"
ctrlc = "3"
num_cpus = "1"
rand = "0.8"
rayon = "1"
tiny_http = "0.12"
pnet = "0.35"
uuid = { version = "1.0", features = ["v4"] }

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.18"

[build-dependencies]
cc = "1.2"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
vulkan = []

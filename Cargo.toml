[package]
name = "cheetah"
version = "1.0.0-rc4.0"
edition = "2024"
description = "Local model chat and OpenAI-compatible inference powered by Safetensors."
license = "Apache-2.0"

[dependencies]

safetensors = "0.8"
tokenizers = "0.23"
memmap2 ="0.9"
libc = "0.2"
half = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

bytes = "1"
ctrlc = "3"
num_cpus = "1"
rand = "0.8"
rayon = "1"
tiny_http = "0.12"

tracing = "0.1"
indicatif = "0.18"

[build-dependencies]
cc = "1.2"

[features]
default = []
vulkan = []

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1

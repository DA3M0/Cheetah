[package]
name = "cheetah"
version = "1.2.0"
edition = "2024"
description = "Local model chat and OpenAI-compatible inference powered by Safetensors."
license = "Apache-2.0"

[dependencies]

safetensors = "0.8"
tokenizers = "0.23"
memmap2 ="0.9"
libc = "0.2"
half = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

axum = "0.8"
futures-core = "0.3"
bytes = "1"
ctrlc = "3"
num_cpus = "1"
rand = "0.8"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"

[build-dependencies]
cc = "1.2"

[features]
default = []
vulkan = []

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
